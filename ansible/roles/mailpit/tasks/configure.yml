---
- name: Deploy Mailpit systemd service
  become: True
  template:
    src: mailpit.service.j2
    dest: /etc/systemd/system/mailpit.service
    mode: '0644'
  notify:
    - reload systemd
    - restart mailpit

- name: Enable and start Mailpit service
  become: True
  systemd:
    name: mailpit
    enabled: yes
    state: started
